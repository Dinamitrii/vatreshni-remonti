<style>
:root{--ink:#172321;--muted:#59645f;--green:#234c3b;--lime:#d2ed83;--paper:#f7f7f2;--line:#e3e7df}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px 'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}.top{width:100vw;margin-left:calc(50% - 50vw);padding:3px 8px;box-sizing:border-box;height:104px;position:relative;display:flex;align-items:center;justify-content:flex-start;gap:18px}.brand{font:800 20px Manrope,sans-serif;letter-spacing:-.7px}.nav{display:flex;flex:none;gap:26px;color:#50605a;font-size:14px}.header-tools{position:absolute;left:50%;transform:translateX(-50%);width:max-content;display:flex;align-items:center;justify-content:center;gap:28px}.contact{background:var(--green);color:white;padding:12px 18px;border-radius:7px;font-size:14px;font-weight:700}.brand-logo{display:block;width:96px;height:96px;margin-left:0;overflow:hidden;flex:0 0 auto}.brand-logo img{display:block;width:96px;height:96px;max-width:100%;object-fit:contain;object-position:center}.hero{background:var(--green);color:#fff;border-radius:18px;min-height:380px;padding:68px 7%;position:relative;overflow:hidden;display:flex;align-items:center}.eyebrow{color:var(--lime);font-size:12px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}.hero h1{font:800 clamp(40px,6vw,68px)/1.04 Manrope;margin:16px 0;letter-spacing:-3px;max-width:650px}.hero p{color:#d6e0d9;max-width:490px;line-height:1.7}.actions{display:flex;gap:12px;margin-top:28px}.btn{display:inline-block;padding:14px 20px;border-radius:7px;font-weight:700;font-size:14px}.btn-lime{background:var(--lime);color:#1d3329}.btn-outline{border:1px solid #ffffff66;color:white}.section{padding:64px 0}.section h1,.section h2{font:800 32px Manrope;letter-spacing:-1.2px;margin:8px 0}.gallery-page{padding:40px 0 56px}.gallery-page h1{margin:8px 0 12px}


@media(max-width:900px){.top{gap:12px}.header-tools{position:static;transform:none;width:auto;flex:1;min-width:0;gap:14px}.brand-logo{width:96px}.brand-logo img{width:96px}}
@media(max-width:700px){.top{height:auto;min-height:100px;flex-wrap:wrap;row-gap:6px;padding-bottom:8px}.brand-logo{order:1;width:88px;height:88px}.brand-logo img{width:88px;height:88px}.header-tools{position:static;transform:none;width:100%;order:2;flex:1 0 100%;display:flex;flex-direction:column;align-items:stretch;gap:8px}.header-tools .contact{text-align:center}.nav{display:none}.hero{padding:42px 26px;min-height:360px}.actions{flex-wrap:wrap}.section{padding:40px 0}.gallery-page{padding:24px 0 40px}}
